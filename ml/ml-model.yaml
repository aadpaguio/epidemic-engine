apiVersion: batch/v1
kind: Job
metadata:
  name: outbreak-predict
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: outbreak-predict
          image: image-registry.openshift-image-registry.svc:5000/ds551-2026-spring-a5f0d1/outbreak-predict:latest
          env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: outbreak-db-url
                key: database_url
          - name: MODEL_PATH
            value: "ml/model.pkl"
          - name: MODEL_VERSION
            value: "v1"
          - name: THRESHOLD
            value: "0.5"
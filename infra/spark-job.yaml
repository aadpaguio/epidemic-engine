# One-shot Kubernetes Job — ideal for manual testing and grading demos.
# For hourly runs aligned with closed clock hours, add a CronJob (see phase-2 plan).
#
# Prereqs:
#   - Apply RBAC: oc apply -f infra/spark-rbac.yaml
#   - With SKIP_JDBC_WRITE=true (default below): no DB secret required.
#   - For real JDBC writes: set SKIP_JDBC_WRITE to false/remove it, uncomment JDBC_* env,
#     and create secret epidemic-db-spark (username + password keys).
#   - Replace image path if your OpenShift project name differs.
#
# Run once:
#   oc apply -n <namespace> -f infra/spark-job.yaml
#   oc logs -f job/epidemic-spark-etl
#
# Re-run after a completion (Jobs are immutable): delete the job first, e.g.
#   oc delete job epidemic-spark-etl
#
apiVersion: batch/v1
kind: Job
metadata:
  name: epidemic-spark-etl
  labels:
    app: epidemic-spark-etl
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: epidemic-spark-etl
    spec:
      serviceAccountName: spark-etl
      restartPolicy: OnFailure
      containers:
        - name: spark-etl
          # Must match `oc project -q` (ImageStream lives in that project).
          image: image-registry.openshift-image-registry.svc:5000/ds551-2026-spring-a5f0d1/epidemic-spark-etl:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          env:
            # Same bootstrap as Phase 1 (`tekton/pipelinerun.yaml` → `kafka-bootstrap`).
            - name: KAFKA_BOOTSTRAP
              value: "kafka.ds551-2026-spring-a5f0d1.svc.cluster.local:9092"
            - name: TOPIC_SYMPTOM
              value: "ds551-s26.team02.symptom_reports"
            - name: TOPIC_CLINIC
              value: "ds551-s26.team02.clinic_visits"
            - name: TOPIC_HOSPITAL
              value: "ds551-s26.team02.hospital_admissions"
            # Dry-run: Kafka → Spark facts + [ANALYTICS] logs; no TimescaleDB required.
            - name: SKIP_JDBC_WRITE
              value: "true"
            # Uncomment when SKIP_JDBC_WRITE is removed/false and secret exists:
            # - name: JDBC_URL
            #   value: "jdbc:postgresql://timescaledb-service:5432/epidemic"
            # - name: JDBC_USER
            #   valueFrom:
            #     secretKeyRef:
            #       name: epidemic-db-spark
            #       key: username
            # - name: JDBC_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: epidemic-db-spark
            #       key: password
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

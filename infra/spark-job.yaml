# One-shot Kubernetes Job — ideal for manual testing and grading demos.
# For hourly runs aligned with closed clock hours, add a CronJob (see phase-2 plan).
#
# Prereqs:
#   - Apply RBAC: oc apply -f infra/spark-rbac.yaml
#   - With SKIP_JDBC_WRITE=true (default below): no DB secret required.
#   - For real JDBC writes: set SKIP_JDBC_WRITE to false/remove it, uncomment JDBC_* env,
#     and create secret epidemic-db-spark (username + password keys).
#   - Create ConfigMap from repo script:
#       oc create configmap spark-etl-script --from-file=etl.py=spark/etl.py \
#         --dry-run=client -o yaml | oc apply -f -
#
# Run once:
#   oc apply -n <namespace> -f infra/spark-job.yaml
#   oc logs -f job/epidemic-spark-etl
#
# Re-run after a completion (Jobs are immutable): delete the job first, e.g.
#   oc delete job epidemic-spark-etl
#
apiVersion: batch/v1
kind: Job
metadata:
  name: epidemic-spark-etl
  labels:
    app: epidemic-spark-etl
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: epidemic-spark-etl
    spec:
      serviceAccountName: spark-etl
      restartPolicy: OnFailure
      containers:
        - name: spark-etl
          # TA fallback: use pre-built Spark image while OpenShift builds are unreliable.
          image: apache/spark:3.5.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              export HOME=/tmp
              export PIP_NO_CACHE_DIR=1
              pip install kafka-python-ng psycopg2-binary --target=/tmp/pkgs --quiet
              export PYTHONPATH="/tmp/pkgs${PYTHONPATH:+:$PYTHONPATH}"
              SPARK_HOME="${SPARK_HOME:-/opt/spark}"
              # PySpark lives in the image; spark-submit wires the classpath. Kafka SQL
              # connector is fetched via Ivy (--packages); cache under /tmp for OpenShift UIDs.
              exec "${SPARK_HOME}/bin/spark-submit" \
                --master 'local[*]' \
                --conf spark.jars.ivy=/tmp/spark-ivy2 \
                --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.7.3 \
                /opt/epidemic/etl.py
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          env:
            # Same bootstrap as Phase 1 (`tekton/pipelinerun.yaml` → `kafka-bootstrap`).
            - name: KAFKA_BOOTSTRAP
              value: "kafka.ds551-2026-spring-a5f0d1.svc.cluster.local:9092"
            - name: TOPIC_SYMPTOM
              value: "ds551-s26.team02.symptom_reports"
            - name: TOPIC_CLINIC
              value: "ds551-s26.team02.clinic_visits"
            - name: TOPIC_HOSPITAL
              value: "ds551-s26.team02.hospital_admissions"
            # Dry-run: Kafka → Spark facts + [ANALYTICS] logs; no TimescaleDB required.
            - name: SKIP_JDBC_WRITE
              value: "true"
            # Uncomment when SKIP_JDBC_WRITE is removed/false and secret exists:
            # - name: JDBC_URL
            #   value: "jdbc:postgresql://timescaledb-service:5432/epidemic"
            # - name: JDBC_USER
            #   valueFrom:
            #     secretKeyRef:
            #       name: epidemic-db-spark
            #       key: username
            # - name: JDBC_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: epidemic-db-spark
            #       key: password
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: etl-script
              mountPath: /opt/epidemic
              readOnly: true
      volumes:
        - name: etl-script
          configMap:
            name: spark-etl-script

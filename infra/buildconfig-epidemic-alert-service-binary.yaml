# Binary Docker build for epidemic-alert-service (same pattern as
# buildconfig-outbreak-predict-binary.yaml). Build context must be the
# repository root so alert/Dockerfile COPY paths resolve.
#
# From repo root:
#   oc apply -n <your-project> -f infra/buildconfig-epidemic-alert-service-binary.yaml
#   oc start-build epidemic-alert-service --from-dir=. --follow
#
# Then deploy or refresh:
#   oc apply -f alert/alert-deployment.yaml
#   oc rollout restart deploy/epidemic-alert-service
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: epidemic-alert-service
spec: {}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: epidemic-alert-service
  labels:
    app: epidemic-alert-service
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: alert/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: epidemic-alert-service:latest
  triggers:
    - type: ConfigChange

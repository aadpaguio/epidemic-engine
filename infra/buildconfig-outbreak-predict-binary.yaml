apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: outbreak-predict
spec: {}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: outbreak-predict
  labels:
    app: outbreak-predict
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: ml/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: outbreak-predict:latest
  triggers:
    - type: ConfigChange

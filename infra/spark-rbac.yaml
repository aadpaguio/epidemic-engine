# ServiceAccount for the Spark ETL pod. Local-mode PySpark does not need extra K8s API
# permissions; keep this SA for a stable identity and future RBAC if you move to cluster mode.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-etl
  labels:
    app: epidemic-spark-etl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-etl-gate-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-etl-gate-rolebinding
subjects:
  - kind: ServiceAccount
    name: spark-etl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-etl-gate-role

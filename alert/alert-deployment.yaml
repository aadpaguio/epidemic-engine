apiVersion: v1
kind: ConfigMap
metadata:
  name: epidemic-alert-config
  labels:
    app: epidemic-alert-service
data:
  # Polling and lifecycle
  ALERT_POLL_SECONDS: "300"
  ALERT_COOLDOWN_SECONDS: "1800"
  ESCALATE_AFTER_SECONDS: "7200"

  # ML / pipeline rules
  PREDICTION_STALE_MINUTES: "180"
  FEATURE_STALE_HOURS: "12"
  OUTBREAK_LOOKBACK_HOURS: "24"
  MIN_CONFIRMING_MODELS: "2"
  OUTBREAK_ALERT_SINGLE_MODEL: "0"

  # Threshold ConfigMap mount path (see epidemic-alert-rules below)
  ALERT_RULES_PATH: "/etc/alerting/thresholds.json"

  # Slack delivery
  # Set SLACK_ENABLED=1 once the epidemic-slack-webhook Secret is populated.
  SLACK_ENABLED: "1"
  SLACK_CHANNEL_NAME: "#epidemic-alerts"
  SLACK_CRITICAL_MENTION: "<!channel>"
  SLACK_NOTIFY_SEVERITIES: "critical,warning"
  SLACK_TIMEOUT_SECONDS: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: epidemic-alert-rules
  labels:
    app: epidemic-alert-service
data:
  thresholds.json: |
    {
      "high_event_volume": {
        "metric": "event_count",
        "windows": [
          {"name": "5m", "minutes": 5, "threshold": 50},
          {"name": "1h", "minutes": 60, "threshold": 1000},
          {"name": "1d", "minutes": 1440, "threshold": 20000}
        ],
        "severity": "warning",
        "min_windows_breaching": 2,
        "cooldown_seconds": 1800
      },
      "high_avg_severity": {
        "metric": "avg_severity",
        "windows": [
          {"name": "5m", "minutes": 5, "threshold": 3.0},
          {"name": "1h", "minutes": 60, "threshold": 2.8},
          {"name": "1d", "minutes": 1440, "threshold": 2.5}
        ],
        "severity": "critical",
        "min_windows_breaching": 2,
        "cooldown_seconds": 1800
      },
      "high_landed_data_quality_issue_rate": {
        "metric": "data_quality_issue_pct",
        "windows": [
          {"name": "1h", "minutes": 60, "threshold": 25.0},
          {"name": "6h", "minutes": 360, "threshold": 20.0},
          {"name": "24h", "minutes": 1440, "threshold": 15.0}
        ],
        "severity": "warning",
        "min_windows_breaching": 2,
        "cooldown_seconds": 3600
      },
      "high_missing_severity_rate": {
        "metric": "missing_severity_pct",
        "windows": [
          {"name": "1h", "minutes": 60, "threshold": 30.0},
          {"name": "6h", "minutes": 360, "threshold": 25.0},
          {"name": "24h", "minutes": 1440, "threshold": 20.0}
        ],
        "severity": "warning",
        "min_windows_breaching": 2,
        "cooldown_seconds": 3600
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epidemic-alert-service
  labels:
    app: epidemic-alert-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epidemic-alert-service
  template:
    metadata:
      labels:
        app: epidemic-alert-service
    spec:
      containers:
        - name: epidemic-alert-service
          # Build from repo root: podman build -f alert/Dockerfile -t <registry>/<project>/epidemic-alert-service:latest .
          image: image-registry.openshift-image-registry.svc:5000/ds551-2026-spring-a5f0d1/epidemic-alert-service:latest
          envFrom:
            - configMapRef:
                name: epidemic-alert-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outbreak-db-url
                  key: database_url
            # Slack webhook is loaded from a separate Secret so it can be
            # rotated without redeploying the ConfigMap. Mark the secret
            # optional so the pod still starts before Slack is provisioned.
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: epidemic-slack-webhook
                  key: webhook_url
                  optional: true
          volumeMounts:
            - name: alert-rules
              mountPath: /etc/alerting
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: alert-rules
          configMap:
            name: epidemic-alert-rules
            items:
              - key: thresholds.json
                path: thresholds.json

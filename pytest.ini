[pytest]
testpaths = tests
pythonpath = .
markers =
    spark: tests that require PySpark (local mode)
    db: tests that require live Postgres (EPIDEMIC_TEST_PG_URL or repo .env DB_* vars)
    cluster: offline Phase 1 manifest contracts (Tekton + Spark raw_db job YAML); no oc required
filterwarnings =
    ignore::DeprecationWarning

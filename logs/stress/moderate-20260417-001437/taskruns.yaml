    taskSpec:
      description: |
        Consume validated events, enrich with team metadata, route to typed topics or routing DLQ.
      params:
      - name: kafka-bootstrap
        type: string
      - name: input-topic
        type: string
      - name: symptom-topic
        type: string
      - name: clinic-topic
        type: string
      - name: hospital-topic
        type: string
      - default: ""
        name: routing-dlq-topic
        type: string

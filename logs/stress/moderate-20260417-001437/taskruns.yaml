        name: consumer-group-id
        type: string
      steps:
      - computeResources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: KAFKA_BOOTSTRAP
          value: kafka.ds551-2026-spring-a5f0d1.svc.cluster.local:9092
        - name: INPUT_TOPIC
          value: ds551-s26.team02.validated.moderate-20260417-001437
        - name: SYMPTOM_TOPIC
          value: ds551-s26.team02.symptom_reports.moderate-20260417-001437
        - name: CLINIC_TOPIC
          value: ds551-s26.team02.clinic_visits.moderate-20260417-001437
        - name: HOSPITAL_TOPIC
          value: ds551-s26.team02.hospital_admissions.moderate-20260417-001437
        - name: ROUTING_DLQ_TOPIC
          value: ds551-s26.team02.routing_dlq.moderate-20260417-001437
        - name: TEAM_ID
          value: team02
        - name: BATCH_SIZE
          value: "400000"
        - name: CONSUMER_TIMEOUT_MS
          value: "300000"
        - name: CONSUMER_GROUP_ID
          value: team02-route-moderate-20260417-001437
        image: python:3.11-slim
        name: route
        script: "set -e\npip install --no-cache-dir -q kafka-python-ng\nexec python
          -u - <<'PY'\nimport base64\nimport hashlib\nimport json\nimport os\nfrom
          datetime import datetime, timezone\n\nfrom kafka import KafkaConsumer, KafkaProducer\n\nTASK
          = \"route-and-enrich\"\nPHASE = \"route\"\nGROUP = os.environ.get(\"CONSUMER_GROUP_ID\",
          \"team02-route-group\")\nCONSUMER_TIMEOUT_MS = max(\n    0, int(os.environ.get(\"CONSUMER_TIMEOUT_MS\",
          \"30000\"))\n)\n\nBOOTSTRAP = os.environ[\"KAFKA_BOOTSTRAP\"]\nINPUT_TOPIC
          = os.environ[\"INPUT_TOPIC\"]\nSYMPTOM_TOPIC = os.environ[\"SYMPTOM_TOPIC\"]\nCLINIC_TOPIC
          = os.environ[\"CLINIC_TOPIC\"]\nHOSPITAL_TOPIC = os.environ[\"HOSPITAL_TOPIC\"]\nDLQ_TOPIC
          = os.environ.get(\"ROUTING_DLQ_TOPIC\", \"\").strip()\nTEAM_ID = os.environ[\"TEAM_ID\"]\nBATCH_SIZE
          = max(0, int(os.environ.get(\"BATCH_SIZE\", \"100\")))\n\nTYPE_TO_TOPIC
          = {\n    \"symptom_report\": SYMPTOM_TOPIC,\n    \"clinic_visit\": CLINIC_TOPIC,\n
          \   \"hospital_admission\": HOSPITAL_TOPIC,\n}\n\ndef pipeline_log(\n    event_id,\n
          \   outcome,\n    reason_code,\n    target_topic=None,\n    extra=None,\n):\n
          \   payload = {\n        \"task\": TASK,\n        \"phase\": PHASE,\n        \"event_id\":
          event_id,\n        \"outcome\": outcome,\n        \"reason_code\": reason_code,\n
          \   }\n    if target_topic is not None:\n        payload[\"target_topic\"]
          = target_topic\n    if extra:\n        payload.update(extra)\n    print(f\"[PIPELINE]
          {json.dumps(payload)}\", flush=True)\n\ndef stable_key_from_raw(raw: bytes)
          -> str:\n    return \"sha256-\" + hashlib.sha256(raw).hexdigest()\n\ndef
          enrich(payload: dict) -> dict:\n    out = dict(payload)\n    out[\"team_id\"]
          = TEAM_ID\n    out[\"processing_timestamp\"] = (\n        datetime.now(timezone.utc).isoformat().replace(\"+00:00\",
          \"Z\")\n    )\n    out[\"event_source\"] = \"ds551-event-generator\"\n    return
          out\n\ndef send_routing_dlq(\n    producer,\n    key: str | None,\n    envelope:
          dict,\n) -> tuple[bool, bool]:\n    \"\"\"Returns (sent_to_dlq, had_produce_error).\"\"\"\n
          \   if not DLQ_TOPIC:\n        return False, False\n    try:\n        producer.send(DLQ_TOPIC,
          key=key, value=envelope)\n        return True, False\n    except Exception
          as pe:\n        pipeline_log(\n            key,\n            \"error\",\n
          \           \"PRODUCE_FAILED\",\n            DLQ_TOPIC,\n            {\"error\":
          str(pe)},\n        )\n        return False, True\n\nconsumer_kwargs = dict(\n
          \   bootstrap_servers=BOOTSTRAP,\n    group_id=GROUP,\n    auto_offset_reset=\"earliest\",\n
          \   value_deserializer=lambda b: b,\n    enable_auto_commit=True,\n)\nif
          CONSUMER_TIMEOUT_MS > 0:\n    consumer_kwargs[\"consumer_timeout_ms\"] =
          CONSUMER_TIMEOUT_MS\nconsumer = KafkaConsumer(INPUT_TOPIC, **consumer_kwargs)\nproducer
          = KafkaProducer(\n    bootstrap_servers=BOOTSTRAP,\n    value_serializer=lambda
          v: json.dumps(v, default=str).encode(\"utf-8\"),\n    key_serializer=lambda
          k: k.encode(\"utf-8\") if k is not None else None,\n)\n\ntotal_consumed
          = valid_count = dlq_count = error_count = 0\nsilent_dropped = 0\nsummary_status
          = \"\"\n\ntry:\n    while total_consumed < BATCH_SIZE:\n        poll_timeout
          = CONSUMER_TIMEOUT_MS if CONSUMER_TIMEOUT_MS > 0 else 30000\n        packs
          = consumer.poll(timeout_ms=poll_timeout)\n        if not packs:\n            break\n
          \       for _tp, records in packs.items():\n            for rec in records:\n
          \               if total_consumed >= BATCH_SIZE:\n                    break\n
          \               total_consumed += 1\n                raw = rec.value if
          rec.value is not None else b\"\"\n                part = rec.partition\n
          \               off = rec.offset\n\n                try:\n                    obj
          = json.loads(raw.decode(\"utf-8\"))\n                except json.JSONDecodeError
          as e:\n                    kid = stable_key_from_raw(raw)\n                    pipeline_log(\n
          \                       kid,\n                        \"dlq\",\n                        \"JSON_PARSE\",\n
          \                       DLQ_TOPIC or None,\n                        {\"parse_error\":
          str(e)},\n                    )\n                    envelope = {\n                        \"failure_reason\":
          str(e),\n                        \"reason_code\": \"JSON_PARSE\",\n                        \"failed_at\":
          datetime.now(timezone.utc)\n                        .isoformat()\n                        .replace(\"+00:00\",
          \"Z\"),\n                        \"original_value_b64\": base64.b64encode(raw).decode(\n
          \                           \"ascii\"\n                        ),\n                        \"original_partition\":
          part,\n                        \"original_offset\": off,\n                    }\n
          \                   sent, perr = send_routing_dlq(producer, kid, envelope)\n
          \                   if perr:\n                        error_count += 1\n
          \                   elif sent:\n                        dlq_count += 1\n
          \                   else:\n                        dlq_count += 1\n                    continue\n\n
          \               if not isinstance(obj, dict):\n                    eid =
          None\n                    kid = stable_key_from_raw(raw)\n                    rc
          = \"JSON_PARSE\"\n                    pipeline_log(\n                        kid,\n
          \                       \"dlq\",\n                        rc,\n                        DLQ_TOPIC
          or None,\n                    )\n                    envelope = {\n                        \"failure_reason\":
          \"payload is not a JSON object\",\n                        \"reason_code\":
          rc,\n                        \"failed_at\": datetime.now(timezone.utc)\n
          \                       .isoformat()\n                        .replace(\"+00:00\",
          \"Z\"),\n                        \"original_value_b64\": base64.b64encode(raw).decode(\n
          \                           \"ascii\"\n                        ),\n                        \"original_partition\":
          part,\n                        \"original_offset\": off,\n                    }\n
          \                   sent, perr = send_routing_dlq(producer, kid, envelope)\n
          \                   if perr:\n                        error_count += 1\n
          \                   elif sent:\n                        dlq_count += 1\n
          \                   else:\n                        dlq_count += 1\n                    continue\n\n
          \               eid = obj.get(\"event_id\")\n                eid_str = str(eid)
          if eid is not None else None\n                kid = eid_str if eid_str else
          stable_key_from_raw(raw)\n\n                et = obj.get(\"event_type\")\n
          \               target = TYPE_TO_TOPIC.get(et) if et is not None else None\n\n
          \               # INSTRUCTIONS.md Stage 2 — unroutable types: silent drop
          (no topic, no DLQ).\n                if target is None:\n                    silent_dropped
          += 1\n                    continue\n\n                enriched = enrich(obj)\n
          \               try:\n                    producer.send(target, key=kid,
          value=enriched)\n                    valid_count += 1\n                    pipeline_log(\n
          \                       eid_str,\n                        \"valid\",\n                        \"OK\",\n
          \                       target,\n                    )\n                except
          Exception as pe:\n                    pipeline_log(\n                        eid_str,\n
          \                       \"error\",\n                        \"PRODUCE_FAILED\",\n
          \                       target,\n                        {\"error\": str(pe)},\n
          \                   )\n                    envelope = {\n                        \"failure_reason\":
          str(pe),\n                        \"reason_code\": \"PRODUCE_FAILED\",\n
          \                       \"target_topic\": target,\n                        \"payload\":
          enriched,\n                        \"failed_at\": datetime.now(timezone.utc)\n
          \                       .isoformat()\n                        .replace(\"+00:00\",
          \"Z\"),\n                        \"original_partition\": part,\n                        \"original_offset\":
          off,\n                    }\n                    sent, perr = send_routing_dlq(producer,
          kid, envelope)\n                    if perr:\n                        error_count
          += 1\n                    elif sent:\n                        dlq_count
          += 1\n                    else:\n                        dlq_count += 1\n
          \           if total_consumed >= BATCH_SIZE:\n                break\n        if
          total_consumed >= BATCH_SIZE:\n            break\nexcept:\n    summary_status=\"failed\"\nfinally:\n
          \   producer.flush()\n    assignment = consumer.assignment()\n    positions
          = {}\n    for tp in assignment:\n        positions[f\"{tp.topic}:{tp.partition}\"]
          = consumer.position(tp)\n    consumer.close()\n\nif summary_status!=\"failed\":\n
          \   if (error_count==0) and (dlq_count==0): \n        summary_status=\"healthy\"\n
          \   else: \n        summary_status=\"degraded\"\n\nsummary = {\n    \"task\":
          TASK,\n    \"phase\": PHASE,\n    \"status\": summary_status,\n    \"total_consumed\":
          total_consumed,\n    \"valid_count\": valid_count,\n    \"silent_dropped\":
          silent_dropped,\n    \"dlq_count\": dlq_count,\n    \"error_count\": error_count,\n
          \   \"final_positions\": positions,\n}\nprint(f\"[PIPELINE] {json.dumps(summary)}\",
          flush=True)\nprint(\n    \"SUMMARY route-and-enrich: \"\n    f\"status={summary_status}
          \"\n    f\"consumed={total_consumed} valid={valid_count} \"\n    f\"silent_dropped={silent_dropped}
          dlq={dlq_count} errors={error_count}\",\n    flush=True,\n)\nPY\n"

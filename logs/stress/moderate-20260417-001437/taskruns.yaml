      name: validate
      provenance: {}
      terminated:
        containerID: cri-o://445fe3f9739f7e21dc3538d772bdae28386d5c02ccd521d9d3359e0ce0fee9be
        exitCode: 0
        finishedAt: "2026-04-17T04:31:02Z"

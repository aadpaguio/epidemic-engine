    taskSpec:
      description: |
        Consume raw Kafka events, validate schema, produce valid records to output topic and invalid ones to validate DLQ. Event stream does not necessarily contain event_id; this task assigns evt-<uuid> before validation so the pipeline can run end-to-end.
      params:
      - name: kafka-bootstrap
        type: string
      - name: input-topic
        type: string
      - name: output-topic
        type: string
      - default: ""
        name: validate-dlq-topic
        type: string
      - default: "100"
        name: batch-size
        type: string
      - default: "30000"
        name: consumer-timeout-ms
        type: string
      - default: team02-validate-group
        name: consumer-group-id
        type: string
      steps:
      - computeResources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: KAFKA_BOOTSTRAP
          value: kafka.ds551-2026-spring-a5f0d1.svc.cluster.local:9092
        - name: INPUT_TOPIC
          value: ds551-s26.team02.raw.moderate-20260417-001437
        - name: OUTPUT_TOPIC
          value: ds551-s26.team02.validated.moderate-20260417-001437
        - name: VALIDATE_DLQ_TOPIC
          value: ds551-s26.team02.validate_dlq.moderate-20260417-001437
        - name: BATCH_SIZE
          value: "400000"
        - name: CONSUMER_TIMEOUT_MS
          value: "300000"
        - name: CONSUMER_GROUP_ID
          value: team02-validate-moderate-20260417-001437
        image: python:3.11-slim
        name: validate
        script: "set -e\npip install --no-cache-dir -q kafka-python-ng\nexec python
          -u - <<'PY'\nimport base64\nimport hashlib\nimport json\nimport os\nimport
          re\nimport uuid\nfrom datetime import datetime, timezone\n\nfrom kafka import
          KafkaConsumer, KafkaProducer\n\nTASK = \"validate-events\"\nPHASE = \"validate\"\nGROUP
          = os.environ.get(\"CONSUMER_GROUP_ID\", \"team02-validate-group\")\nCONSUMER_TIMEOUT_MS
          = max(\n    0, int(os.environ.get(\"CONSUMER_TIMEOUT_MS\", \"30000\"))\n)\n\nBOOTSTRAP
          = os.environ[\"KAFKA_BOOTSTRAP\"]\nINPUT_TOPIC = os.environ[\"INPUT_TOPIC\"]\nOUTPUT_TOPIC
          = os.environ[\"OUTPUT_TOPIC\"]\nDLQ_TOPIC = os.environ.get(\"VALIDATE_DLQ_TOPIC\",
          \"\").strip()\nBATCH_SIZE = max(0, int(os.environ.get(\"BATCH_SIZE\", \"100\")))\n\n#
          INSTRUCTIONS.md Stage 1 — required base fields; event_type routing is Stage
          2.\nREQUIRED_FIELDS = (\n    \"event_type\",\n    \"timestamp\",\n    \"region\",\n)\n_EVENT_ID_RE
          = re.compile(rb'\"event_id\"\\s*:\\s*\"([^\"]*)\"')\n\ndef pipeline_log(\n
          \   event_id,\n    outcome,\n    reason_code,\n    target_topic=None,\n
          \   extra=None,\n):\n    payload = {\n        \"task\": TASK,\n        \"phase\":
          PHASE,\n        \"event_id\": event_id,\n        \"outcome\": outcome,\n
          \       \"reason_code\": reason_code,\n    }\n    if target_topic is not
          None:\n        payload[\"target_topic\"] = target_topic\n    if extra:\n
          \       payload.update(extra)\n    print(f\"[PIPELINE] {json.dumps(payload)}\",
          flush=True)\n\ndef stable_key_from_raw(raw: bytes) -> str:\n    return \"sha256-\"
          + hashlib.sha256(raw).hexdigest()\n\ndef try_extract_event_id(raw: bytes)
          -> str | None:\n    m = _EVENT_ID_RE.search(raw)\n    if m:\n        return
          m.group(1).decode(\"utf-8\", errors=\"replace\")\n    return None\n\n# Synthetic
          id generator: generator payloads did not include event_id; spec still expects
          it for validated output.\ndef synthesize_event_id_if_missing(obj: dict)
          -> bool:\n    \"\"\"Assign evt-<uuid> when event_id is missing or blank.
          Returns True if assigned.\"\"\"\n    eid = obj.get(\"event_id\")\n    missing
          = (\n        eid is None\n        or eid == \"\"\n        or (isinstance(eid,
          str) and eid.strip() == \"\")\n    )\n    if missing:\n        obj[\"event_id\"]
          = f\"evt-{uuid.uuid4()}\"\n        return True\n    return False\n\ndef
          validate_obj(obj) -> tuple[bool, str | None, str | None]:\n    \"\"\"Returns
          (ok, reason_code, event_id_str).\"\"\"\n    if not isinstance(obj, dict):\n
          \       return False, \"JSON_PARSE\", None\n\n    eid = obj.get(\"event_id\")\n
          \   eid_str = str(eid) if eid is not None else None\n\n    for field in
          REQUIRED_FIELDS:\n        if field not in obj or obj[field] in (None, \"\"):\n
          \           return False, f\"MISSING_FIELD:{field}\", eid_str\n\n    ts

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-events
spec:
  description: >
    Consume raw Kafka events, validate schema, produce valid records to output topic and invalid ones to validate DLQ.
    Event stream does not necessarily contain event_id; this task assigns evt-<uuid>
    before validation so the pipeline can run end-to-end.
  params:
    - name: kafka-bootstrap
      type: string
    - name: input-topic
      type: string
    - name: output-topic
      type: string
    - name: validate-dlq-topic
      type: string
      default: ""
    - name: batch-size
      type: string
      default: "100"
    - name: consumer-timeout-ms
      type: string
      default: "30000"
    - name: consumer-group-id
      type: string
      default: "team02-validate-group"
  steps:
    - name: validate
      image: python:3.11-slim
      # Tekton v1: use computeResources (plain "resources" is ignored → LimitRange default e.g. 4Gi).
      computeResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      env:
        - name: KAFKA_BOOTSTRAP
          value: $(params.kafka-bootstrap)
        - name: INPUT_TOPIC
          value: $(params.input-topic)
        - name: OUTPUT_TOPIC
          value: $(params.output-topic)
        - name: VALIDATE_DLQ_TOPIC
          value: $(params.validate-dlq-topic)
        - name: BATCH_SIZE
          value: $(params.batch-size)
        - name: CONSUMER_TIMEOUT_MS
          value: $(params.consumer-timeout-ms)
        - name: CONSUMER_GROUP_ID
          value: $(params.consumer-group-id)
      script: |
        set -e
        pip install --no-cache-dir -q kafka-python-ng
        exec python -u - <<'PY'
        import base64
        import hashlib
        import json
        import os
        import re
        import uuid
        from datetime import datetime, timezone

        from kafka import KafkaConsumer, KafkaProducer

        TASK = "validate-events"
        PHASE = "validate"
        GROUP = os.environ.get("CONSUMER_GROUP_ID", "team02-validate-group")
        CONSUMER_TIMEOUT_MS = max(
            0, int(os.environ.get("CONSUMER_TIMEOUT_MS", "30000"))
        )

        BOOTSTRAP = os.environ["KAFKA_BOOTSTRAP"]
        INPUT_TOPIC = os.environ["INPUT_TOPIC"]
        OUTPUT_TOPIC = os.environ["OUTPUT_TOPIC"]
        DLQ_TOPIC = os.environ.get("VALIDATE_DLQ_TOPIC", "").strip()
        BATCH_SIZE = max(0, int(os.environ.get("BATCH_SIZE", "100")))

        # INSTRUCTIONS.md Stage 1 — required base fields; event_type routing is Stage 2.
        REQUIRED_FIELDS = (
            "event_type",
            "timestamp",
            "region",
        )
        _EVENT_ID_RE = re.compile(rb'"event_id"\s*:\s*"([^"]*)"')

        def pipeline_log(
            event_id,
            outcome,
            reason_code,
            target_topic=None,
            extra=None,
        ):
            payload = {
                "task": TASK,
                "phase": PHASE,
                "event_id": event_id,
                "outcome": outcome,
                "reason_code": reason_code,
            }
            if target_topic is not None:
                payload["target_topic"] = target_topic
            if extra:
                payload.update(extra)
            print(f"[PIPELINE] {json.dumps(payload)}", flush=True)

        def stable_key_from_raw(raw: bytes) -> str:
            return "sha256-" + hashlib.sha256(raw).hexdigest()

        def try_extract_event_id(raw: bytes) -> str | None:
            m = _EVENT_ID_RE.search(raw)
            if m:
                return m.group(1).decode("utf-8", errors="replace")
            return None

        # Synthetic id generator: generator payloads did not include event_id; spec still expects it for validated output.
        def synthesize_event_id_if_missing(obj: dict) -> bool:
            """Assign evt-<uuid> when event_id is missing or blank. Returns True if assigned."""
            eid = obj.get("event_id")
            missing = (
                eid is None
                or eid == ""
                or (isinstance(eid, str) and eid.strip() == "")
            )
            if missing:
                obj["event_id"] = f"evt-{uuid.uuid4()}"
                return True
            return False

        def check_iso8601_string(val: object) -> bool:
            if not isinstance(val, str):
                return False
            try:
                norm = val.replace("Z", "+00:00") if val.endswith("Z") else val
                datetime.fromisoformat(norm)
                return True
            except Exception:
                return False

        def validate_obj(obj) -> tuple[bool, str | None, str | None]:
            """Returns (ok, reason_code, event_id_str)."""
            if not isinstance(obj, dict):
                return False, "JSON_PARSE", None

            eid = obj.get("event_id")
            eid_str = str(eid) if eid is not None else None

            for field in REQUIRED_FIELDS:
                if field not in obj or obj[field] in (None, ""):
                    return False, f"MISSING_FIELD:{field}", eid_str

            ts = obj["timestamp"]
            if not check_iso8601_string(ts):
                return False, "BAD_TIMESTAMP", eid_str

            # CO-2026-01: events may include schema_version; legacy payloads omit it.
            # If present, only schema_version 2 is accepted.
            if "schema_version" in obj and obj["schema_version"] not in (None, ""):
                try:
                    sv_int = int(obj["schema_version"])
                except (TypeError, ValueError):
                    return False, "BAD_SCHEMA_VERSION", eid_str
                if sv_int != 2:
                    return False, "BAD_SCHEMA_VERSION", eid_str

            et = obj.get("event_type")
            if et == "vaccination_record":
                vac_required = (
                    "schema_version",
                    "record_id",
                    "patient_id",
                    "vaccine_type",
                    "dose_number",
                    "administered_at",
                )
                for field in vac_required:
                    if field not in obj or obj[field] in (None, ""):
                        return False, f"MISSING_FIELD:{field}", eid_str
                try:
                    if int(obj["schema_version"]) != 2:
                        return False, "BAD_SCHEMA_VERSION", eid_str
                except (TypeError, ValueError):
                    return False, "BAD_SCHEMA_VERSION", eid_str
                dn = obj["dose_number"]
                if isinstance(dn, bool):
                    return False, "BAD_FIELD:dose_number", eid_str
                try:
                    int(dn)
                except (TypeError, ValueError):
                    return False, "BAD_FIELD:dose_number", eid_str
                if not check_iso8601_string(obj["administered_at"]):
                    return False, "BAD_TIMESTAMP", eid_str

            return True, None, eid_str

        consumer_kwargs = dict(
            bootstrap_servers=BOOTSTRAP,
            group_id=GROUP,
            # Prefer forward-only behavior for new groups.
            auto_offset_reset="latest",
            value_deserializer=lambda b: b,
            enable_auto_commit=False,
        )
        if CONSUMER_TIMEOUT_MS > 0:
            consumer_kwargs["consumer_timeout_ms"] = CONSUMER_TIMEOUT_MS
        consumer = KafkaConsumer(INPUT_TOPIC, **consumer_kwargs)
        producer = KafkaProducer(
            bootstrap_servers=BOOTSTRAP,
            value_serializer=lambda v: json.dumps(v, default=str).encode("utf-8"),
            key_serializer=lambda k: k.encode("utf-8") if k is not None else None,
        )

        total_consumed = valid_count = dlq_count = error_count = 0
        had_processing_error = False
        summary_status = ""

        try:
            while total_consumed < BATCH_SIZE:
                poll_timeout = CONSUMER_TIMEOUT_MS if CONSUMER_TIMEOUT_MS > 0 else 30000
                packs = consumer.poll(timeout_ms=poll_timeout)
                if not packs:
                    break
                for _tp, records in packs.items():
                    for rec in records:
                        if total_consumed >= BATCH_SIZE:
                            break
                        total_consumed += 1
                        raw = rec.value if rec.value is not None else b""
                        #oid = try_extract_event_id(raw)
                        part = rec.partition
                        off = rec.offset

                        try:
                            obj = json.loads(raw.decode("utf-8"))
                        except json.JSONDecodeError as e:
                            rc = "JSON_PARSE"
                            eid = stable_key_from_raw(raw)
                            kid = eid 
                            pipeline_log(
                                eid,
                                "dlq",
                                rc,
                                DLQ_TOPIC or None,
                                {"parse_error": str(e)},
                            )
                            envelope = {
                                "failure_reason": str(e),
                                "reason_code": rc,
                                "failed_at": datetime.now(timezone.utc)
                                .isoformat()
                                .replace("+00:00", "Z"),
                                "original_value_b64": base64.b64encode(raw).decode(
                                    "ascii"
                                ),
                                "original_partition": part,
                                "original_offset": off,
                            }
                            if DLQ_TOPIC:
                                try:
                                    producer.send(
                                        DLQ_TOPIC,
                                        key=kid,
                                        value=envelope,
                                    )
                                    dlq_count += 1
                                except Exception as pe:
                                    error_count += 1
                                    had_processing_error = True
                                    pipeline_log(
                                        kid,
                                        "error",
                                        "PRODUCE_FAILED",
                                        DLQ_TOPIC,
                                        {"error": str(pe)},
                                    )
                            else:
                                dlq_count += 1
                            continue

                        # Run after JSON parse, before validate_obj (so required event_id can be satisfied).
                        synthesized_id = synthesize_event_id_if_missing(obj)
                        ok, reason_code, eid = validate_obj(obj)
                        kid = eid if eid else stable_key_from_raw(raw)

                        if ok:
                            try:
                                producer.send(
                                    OUTPUT_TOPIC,
                                    key=eid,
                                    value=obj,
                                )
                                valid_count += 1
                                pipeline_log(
                                    eid,
                                    "valid",
                                    "OK",
                                    OUTPUT_TOPIC,
                                    (
                                        {"event_id_source": "synthetic"}
                                        if synthesized_id
                                        else None
                                    ),
                                )
                            except Exception as pe:
                                error_count += 1
                                had_processing_error = True
                                pipeline_log(
                                    eid,
                                    "error",
                                    "PRODUCE_FAILED",
                                    OUTPUT_TOPIC,
                                    {"error": str(pe)},
                                )
                            continue

                        pipeline_log(
                            eid,
                            "dlq",
                            reason_code,
                            DLQ_TOPIC or None,
                        )
                        envelope = {
                            "failure_reason": reason_code,
                            "reason_code": reason_code,
                            "failed_at": datetime.now(timezone.utc)
                            .isoformat()
                            .replace("+00:00", "Z"),
                            "original_value_b64": base64.b64encode(raw).decode(
                                "ascii"
                            ),
                            "original_partition": part,
                            "original_offset": off,
                        }
                        if DLQ_TOPIC:
                            try:
                                producer.send(
                                    DLQ_TOPIC,
                                    key=kid,
                                    value=envelope,
                                )
                                dlq_count += 1
                            except Exception as pe:
                                error_count += 1
                                had_processing_error = True
                                pipeline_log(
                                    kid,
                                    "error",
                                    "PRODUCE_FAILED",
                                    DLQ_TOPIC,
                                    {"error": str(pe)},
                                )
                        else:
                            dlq_count += 1
                    if total_consumed >= BATCH_SIZE:
                        break
                if total_consumed >= BATCH_SIZE:
                    break
        except: 
            summary_status="failed"
            had_processing_error = True
        finally:
            producer.flush()
            if not had_processing_error:
                consumer.commit()
            assignment = consumer.assignment()
            positions = {}
            for tp in assignment:
                positions[f"{tp.topic}:{tp.partition}"] = consumer.position(tp)
            consumer.close()

        if summary_status!="failed":
            if (error_count==0) and (dlq_count==0): 
                summary_status="healthy"
            else: 
                summary_status="degraded"

        summary = {
            "task": TASK,
            "phase": PHASE,
            "status": summary_status,
            "total_consumed": total_consumed,
            "valid_count": valid_count,
            "dlq_count": dlq_count,
            "error_count": error_count,
            "final_positions": positions,
        }
        print(f"[PIPELINE] {json.dumps(summary)}", flush=True)
        print(
            "SUMMARY validate-events: "
            f"status={summary_status} "
            f"consumed={total_consumed} valid={valid_count} "
            f"dlq={dlq_count} errors={error_count}",
            flush=True,
        )
        PY

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: route-and-enrich
spec:
  description: |
    Consume validated events, enrich with team metadata, route to typed topics or routing DLQ.
  params:
    - name: kafka-bootstrap
      type: string
    - name: input-topic
      type: string
    - name: symptom-topic
      type: string
    - name: clinic-topic
      type: string
    - name: hospital-topic
      type: string
    - name: vaccination-topic
      type: string
    - name: routing-dlq-topic
      type: string
      default: ""
    - name: team-id
      type: string
    - name: batch-size
      type: string
      default: "100"
    - name: consumer-timeout-ms
      type: string
      default: "30000"
    - name: consumer-group-id
      type: string
      default: "team02-route-group"
  steps:
    - name: route
      image: python:3.11-slim
      computeResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      env:
        - name: KAFKA_BOOTSTRAP
          value: $(params.kafka-bootstrap)
        - name: INPUT_TOPIC
          value: $(params.input-topic)
        - name: SYMPTOM_TOPIC
          value: $(params.symptom-topic)
        - name: CLINIC_TOPIC
          value: $(params.clinic-topic)
        - name: HOSPITAL_TOPIC
          value: $(params.hospital-topic)
        - name: VACCINATION_TOPIC
          value: $(params.vaccination-topic)
        - name: ROUTING_DLQ_TOPIC
          value: $(params.routing-dlq-topic)
        - name: TEAM_ID
          value: $(params.team-id)
        - name: BATCH_SIZE
          value: $(params.batch-size)
        - name: CONSUMER_TIMEOUT_MS
          value: $(params.consumer-timeout-ms)
        - name: CONSUMER_GROUP_ID
          value: $(params.consumer-group-id)
      script: |
        set -e
        pip install --no-cache-dir -q kafka-python-ng
        exec python -u - <<'PY'
        import base64
        import hashlib
        import json
        import os
        from datetime import datetime, timezone

        from kafka import KafkaConsumer, KafkaProducer

        TASK = "route-and-enrich"
        PHASE = "route"
        GROUP = os.environ.get("CONSUMER_GROUP_ID", "team02-route-group")
        CONSUMER_TIMEOUT_MS = max(
            0, int(os.environ.get("CONSUMER_TIMEOUT_MS", "30000"))
        )

        BOOTSTRAP = os.environ["KAFKA_BOOTSTRAP"]
        INPUT_TOPIC = os.environ["INPUT_TOPIC"]
        SYMPTOM_TOPIC = os.environ["SYMPTOM_TOPIC"]
        CLINIC_TOPIC = os.environ["CLINIC_TOPIC"]
        HOSPITAL_TOPIC = os.environ["HOSPITAL_TOPIC"]
        VACCINATION_TOPIC = os.environ["VACCINATION_TOPIC"]
        DLQ_TOPIC = os.environ.get("ROUTING_DLQ_TOPIC", "").strip()
        TEAM_ID = os.environ["TEAM_ID"]
        BATCH_SIZE = max(0, int(os.environ.get("BATCH_SIZE", "100")))

        TYPE_TO_TOPIC = {
            "symptom_report": SYMPTOM_TOPIC,
            "clinic_visit": CLINIC_TOPIC,
            "hospital_admission": HOSPITAL_TOPIC,
            "vaccination_record": VACCINATION_TOPIC,
        }

        def pipeline_log(
            event_id,
            outcome,
            reason_code,
            target_topic=None,
            extra=None,
        ):
            payload = {
                "task": TASK,
                "phase": PHASE,
                "event_id": event_id,
                "outcome": outcome,
                "reason_code": reason_code,
            }
            if target_topic is not None:
                payload["target_topic"] = target_topic
            if extra:
                payload.update(extra)
            print(f"[PIPELINE] {json.dumps(payload)}", flush=True)

        def stable_key_from_raw(raw: bytes) -> str:
            return "sha256-" + hashlib.sha256(raw).hexdigest()

        def enrich(payload: dict) -> dict:
            out = dict(payload)
            out["team_id"] = TEAM_ID
            out["processing_timestamp"] = (
                datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
            )
            out["event_source"] = "ds551-event-generator"
            return out

        def send_routing_dlq(
            producer,
            key: str | None,
            envelope: dict,
        ) -> tuple[bool, bool]:
            """Returns (sent_to_dlq, had_produce_error)."""
            if not DLQ_TOPIC:
                return False, False
            try:
                producer.send(DLQ_TOPIC, key=key, value=envelope)
                return True, False
            except Exception as pe:
                pipeline_log(
                    key,
                    "error",
                    "PRODUCE_FAILED",
                    DLQ_TOPIC,
                    {"error": str(pe)},
                )
                return False, True

        consumer_kwargs = dict(
            bootstrap_servers=BOOTSTRAP,
            group_id=GROUP,
            # Prefer forward-only behavior for new groups.
            auto_offset_reset="latest",
            value_deserializer=lambda b: b,
            enable_auto_commit=False,
        )
        if CONSUMER_TIMEOUT_MS > 0:
            consumer_kwargs["consumer_timeout_ms"] = CONSUMER_TIMEOUT_MS
        consumer = KafkaConsumer(INPUT_TOPIC, **consumer_kwargs)
        producer = KafkaProducer(
            bootstrap_servers=BOOTSTRAP,
            value_serializer=lambda v: json.dumps(v, default=str).encode("utf-8"),
            key_serializer=lambda k: k.encode("utf-8") if k is not None else None,
        )

        total_consumed = valid_count = dlq_count = error_count = 0
        silent_dropped = 0
        summary_status = ""
        had_processing_error = False

        try:
            while total_consumed < BATCH_SIZE:
                poll_timeout = CONSUMER_TIMEOUT_MS if CONSUMER_TIMEOUT_MS > 0 else 30000
                packs = consumer.poll(timeout_ms=poll_timeout)
                if not packs:
                    break
                for _tp, records in packs.items():
                    for rec in records:
                        if total_consumed >= BATCH_SIZE:
                            break
                        total_consumed += 1
                        raw = rec.value if rec.value is not None else b""
                        part = rec.partition
                        off = rec.offset

                        try:
                            obj = json.loads(raw.decode("utf-8"))
                        except json.JSONDecodeError as e:
                            kid = stable_key_from_raw(raw)
                            pipeline_log(
                                kid,
                                "dlq",
                                "JSON_PARSE",
                                DLQ_TOPIC or None,
                                {"parse_error": str(e)},
                            )
                            envelope = {
                                "failure_reason": str(e),
                                "reason_code": "JSON_PARSE",
                                "failed_at": datetime.now(timezone.utc)
                                .isoformat()
                                .replace("+00:00", "Z"),
                                "original_value_b64": base64.b64encode(raw).decode(
                                    "ascii"
                                ),
                                "original_partition": part,
                                "original_offset": off,
                            }
                            sent, perr = send_routing_dlq(producer, kid, envelope)
                            if perr:
                                error_count += 1
                                had_processing_error = True
                            elif sent:
                                dlq_count += 1
                            else:
                                dlq_count += 1
                            continue

                        if not isinstance(obj, dict):
                            eid = None
                            kid = stable_key_from_raw(raw)
                            rc = "JSON_PARSE"
                            pipeline_log(
                                kid,
                                "dlq",
                                rc,
                                DLQ_TOPIC or None,
                            )
                            envelope = {
                                "failure_reason": "payload is not a JSON object",
                                "reason_code": rc,
                                "failed_at": datetime.now(timezone.utc)
                                .isoformat()
                                .replace("+00:00", "Z"),
                                "original_value_b64": base64.b64encode(raw).decode(
                                    "ascii"
                                ),
                                "original_partition": part,
                                "original_offset": off,
                            }
                            sent, perr = send_routing_dlq(producer, kid, envelope)
                            if perr:
                                error_count += 1
                                had_processing_error = True
                            elif sent:
                                dlq_count += 1
                            else:
                                dlq_count += 1
                            continue

                        eid = obj.get("event_id")
                        eid_str = str(eid) if eid is not None else None
                        kid = eid_str if eid_str else stable_key_from_raw(raw)

                        et = obj.get("event_type")
                        target = TYPE_TO_TOPIC.get(et) if et is not None else None

                        # INSTRUCTIONS.md Stage 2 — unroutable types: silent drop (no topic, no DLQ).
                        if target is None:
                            silent_dropped += 1
                            continue

                        enriched = enrich(obj)
                        try:
                            producer.send(target, key=kid, value=enriched)
                            valid_count += 1
                            pipeline_log(
                                eid_str,
                                "valid",
                                "OK",
                                target,
                            )
                        except Exception as pe:
                            pipeline_log(
                                eid_str,
                                "error",
                                "PRODUCE_FAILED",
                                target,
                                {"error": str(pe)},
                            )
                            envelope = {
                                "failure_reason": str(pe),
                                "reason_code": "PRODUCE_FAILED",
                                "target_topic": target,
                                "payload": enriched,
                                "failed_at": datetime.now(timezone.utc)
                                .isoformat()
                                .replace("+00:00", "Z"),
                                "original_partition": part,
                                "original_offset": off,
                            }
                            sent, perr = send_routing_dlq(producer, kid, envelope)
                            if perr:
                                error_count += 1
                                had_processing_error = True
                            elif sent:
                                dlq_count += 1
                            else:
                                dlq_count += 1
                    if total_consumed >= BATCH_SIZE:
                        break
                if total_consumed >= BATCH_SIZE:
                    break
        except:
            summary_status="failed"
            had_processing_error = True
        finally:
            producer.flush()
            if not had_processing_error:
                consumer.commit()
            assignment = consumer.assignment()
            positions = {}
            for tp in assignment:
                positions[f"{tp.topic}:{tp.partition}"] = consumer.position(tp)
            consumer.close()

        if summary_status!="failed":
            if (error_count==0) and (dlq_count==0): 
                summary_status="healthy"
            else: 
                summary_status="degraded"

        summary = {
            "task": TASK,
            "phase": PHASE,
            "status": summary_status,
            "total_consumed": total_consumed,
            "valid_count": valid_count,
            "silent_dropped": silent_dropped,
            "dlq_count": dlq_count,
            "error_count": error_count,
            "final_positions": positions,
        }
        print(f"[PIPELINE] {json.dumps(summary)}", flush=True)
        print(
            "SUMMARY route-and-enrich: "
            f"status={summary_status} "
            f"consumed={total_consumed} valid={valid_count} "
            f"silent_dropped={silent_dropped} dlq={dlq_count} errors={error_count}",
            flush=True,
        )
        PY
